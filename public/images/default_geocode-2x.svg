      <stop offset="0%" stop-color="#5588D9" />
      <stop offset="100%" stop-color="#3F71C9" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" />
  
  <!-- Clouds -->
  <path d="M 220 180 A 20 20 0 0 1 240 160 A 30 30 0 0 1 290 160 A 20 20 0 0 1 310 180 Z" fill="rgba(255,255,255,0.1)" />
