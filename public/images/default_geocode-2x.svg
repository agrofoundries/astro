    <rect x="185" y="245" width="4" height="4" />
    
    <rect x="155" y="260" width="4" height="4" />
    <rect x="165" y="260" width="4" height="4" />
    <rect x="175" y="260" width="4" height="4" />
    
    <rect x="145" y="275" width="4" height="4" fill="#6EA1F0" />
