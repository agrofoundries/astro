  <rect x="400" y="455" width="20" height="10" fill="#4B81D9" />
  <rect x="385" y="465" width="50" height="12" rx="3" fill="#4B81D9" />
  <circle cx="395" cy="477" r="4" fill="#1C346B" />
  <circle cx="425" cy="477" r="4" fill="#1C346B" />
